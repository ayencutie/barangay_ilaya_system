<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Appointments – Barangay Ilaya Health Center</title>
  <link rel="stylesheet" href="css/my appointment.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-left">
      <img src="https://i.ibb.co/qFPvFtms/167565708-10159274632132790-1386372340681598199-n-removebg-preview.png" alt="Logo">
      <h1>BARANGAY ILAYA HEALTH CENTER</h1>
    </div>

    <div class="nav-center">
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="new about us.html">About Us</a></li>
        <li><a href="new services.html">Services</a></li>
      </ul>
    </div>

    <div class="nav-right">
      <a href="inbox.php" class="icon-btn" title="Inbox">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
        </svg>
        <span id="msgBadge" class="badge">0</span>
      </a>

      <div class="dropdown-container">
        <button id="menuButton" class="menu-btn">Menu ▼</button>
        <div id="menuDropdown" class="dropdown-content">
          <a href="book appointment.html">Book Appointment</a>
          <a href="my_appointment.html" class="active">My Appointment</a>
        </div>
      </div>

      <div class="profile-container">
        <button id="profileButton" class="profile-btn" title="Account">
          <img id="userAvatar" src="uploads/default_profile.png" alt="Profile">
          <span class="active-dot"></span>
        </button>

        <div id="profileDropdown" class="profile-card" hidden>
          <div class="profile-header">
            <img id="dropdownAvatar" src="uploads/default_profile.png" alt="User">
            <div class="header-info">
              <strong id="userName">Guest User</strong>
              <span id="userId">Patient ID: --</span>
            </div>
          </div>
          <hr class="divider">
          <div class="profile-links">
            <a href="account.html" class="p-link"><span class="icon"></span> Account Settings</a>
            <hr class="divider-small">
            <a href="php/logout.php" class="p-link logout"><span class="icon"></span> Log Out</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- CONTENT -->
  <section class="content">
    <div class="appointments-container">
      <h1>My Appointments</h1>
      <p>Manage your scheduled visits and view history.</p>

      <div class="tabs-container">
        <button class="tab-btn active" onclick="filterAppointments('upcoming')">Upcoming</button>
        <button class="tab-btn" onclick="filterAppointments('archive')">Archive</button>
      </div>

      <div class="table-responsive">
        <table id="appointmentsTable">
          <thead>
            <tr>
              <th>Service</th>
              <th>Date</th>
              <th>Time</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="5">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- EDIT MODAL -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <h3>Edit Appointment</h3>
      <label for="editService">Service:</label>
      <select id="editService"></select>

      <label for="editDate">Date:</label>
      <input type="date" id="editDate">

      <label for="editTimeSlot">Time Slot:</label>
      <input type="time" id="editTimeSlot">

      <div class="modal-buttons">
        <button id="saveEditBtn" class="btn-save">Save</button>
        <button id="cancelEditBtn" class="btn-cancel">Close</button>
      </div>
    </div>
  </div>

  <div id="toastBox" class="toast-container"></div>
  <audio id="notifSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

  <script>
    // ---------------- NAVBAR ----------------
    const menuBtn = document.getElementById('menuButton');
    const menuDropdown = document.getElementById('menuDropdown');
    const profileBtn = document.getElementById('profileButton');
    const profileDropdown = document.getElementById('profileDropdown');
    menuBtn?.addEventListener('click', e=>{e.stopPropagation(); menuDropdown.classList.toggle('show')});
    profileBtn?.addEventListener('click', e=>{e.stopPropagation(); profileDropdown.hidden=!profileDropdown.hidden});
    window.addEventListener('click', ()=>{ menuDropdown.classList.remove('show'); profileDropdown.hidden=true; });

    // ---------------- USER INFO ----------------
    fetch('php/get_user.php').then(r=>r.json()).then(data=>{
      if(data && !data.error){
        document.getElementById('userAvatar').src = data.profile_pic||'uploads/default_profile.png';
        document.getElementById('dropdownAvatar').src = data.profile_pic||'uploads/default_profile.png';
        document.getElementById('userName').innerText = data.first_name||'User';
        document.getElementById('userId').innerText = data.patient_id||'';
      }
    });

    // ---------------- TOAST ----------------
    function showToast(msg){
      const toastBox = document.getElementById('toastBox');
      const toast = document.createElement('div');
      toast.className='toast';
      toast.innerHTML=`<div class="toast-icon">📩</div><div class="toast-msg"><h4>Notification</h4><p>${msg}</p></div>`;
      toastBox.appendChild(toast);
      setTimeout(()=>toast.classList.add('show'),100);
      setTimeout(()=>{ toast.classList.remove('show'); setTimeout(()=>toast.remove(),500); }, 4000);
    }

    // ---------------- APPOINTMENTS ----------------
    let allAppointments = [], currentFilter='upcoming', editingId=null;

    async function loadAppointments(){
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML='<tr><td colspan="5">Loading...</td></tr>';
      try{
        const res = await fetch('php/my_appointment.php');
        const data = await res.json();
        if(data.status==='success'){ allAppointments=data.appointments; renderTable(); }
        else tbody.innerHTML=`<tr><td colspan="5">${data.message||'No records'}</td></tr>`;
      }catch(e){tbody.innerHTML='<tr><td colspan="5">Error loading data.</td></tr>'; console.error(e);}
    }

    function filterAppointments(type){
      currentFilter=type;
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      event.target.classList.add('active');
      renderTable();
    }

    function renderTable(){
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML='';
      const filtered=allAppointments.filter(a=>{
        if(currentFilter==='upcoming') return a.status==='Pending'||a.status==='Approved';
        else return ['Completed','Cancelled','Missed','Rejected'].includes(a.status);
      });
      if(filtered.length===0){ tbody.innerHTML='<tr><td colspan="5">No records found.</td></tr>'; return; }
      filtered.forEach(a=>{
        let color='#333';
        if(a.status==='Pending') color='orange';
        else if(a.status==='Approved') color='green';
        else if(a.status==='Cancelled'||a.status==='Missed') color='red';
        else if(a.status==='Completed') color='blue';

        let actions='';
        if(currentFilter==='upcoming'){
          actions=`<button class="btn-edit" onclick="openEditModal(${a.appointment_id})">Edit</button>
                   <button class="btn-cancel" onclick="cancelAppointment(${a.appointment_id})">Cancel</button>`;
        } else actions='<span style="color:#888;font-size:12px">Archived</span>';

        const tr=document.createElement('tr');
        tr.innerHTML=`<td>${a.service}</td><td>${a.date}</td><td>${a.time_slot}</td>
                        <td style="color:${color};font-weight:bold">${a.status}</td><td>${actions}</td>`;
        tbody.appendChild(tr);
      });
    }

    // ---------------- CANCEL ----------------
    async function cancelAppointment(id){
      if(!confirm("Cancel this appointment?")) return;
      try{
        const res = await fetch('php/cancel_appointment.php',{method:'POST',body:JSON.stringify({id}),headers:{'Content-Type':'application/json'}});
        const data = await res.json();
        if(data.status==='success'){ showToast("Appointment cancelled."); loadAppointments(); }
        else showToast(data.message||'Failed');
      }catch(e){ console.error(e); showToast('Error cancelling'); }
    }

    // ---------------- EDIT ----------------
    const editModal = document.getElementById('editModal');
    document.getElementById('cancelEditBtn').addEventListener('click',()=>{editModal.style.display='none'});

    const servicesList = ["Immunization","Medical Certificate","Pre Natal / Post Natal","Diagnostic","Outpatient Consultation","Dental Care","Family Planning"];
    const editService = document.getElementById('editService');
    servicesList.forEach(s=>{ let opt=document.createElement('option'); opt.value=s; opt.textContent=s; editService.appendChild(opt); });

    window.openEditModal = function(id){
      editingId=id;
      const appt = allAppointments.find(a=>a.appointment_id===id);
      if(!appt) return alert("Appointment not found");
      editService.value=appt.service;
      document.getElementById('editDate').value=appt.date;
      document.getElementById('editTimeSlot').value=appt.time_slot;
      editModal.style.display='flex';
    }

    document.getElementById('saveEditBtn').addEventListener('click', async()=>{
      const service = editService.value;
      const date = document.getElementById('editDate').value;
      const time_slot = document.getElementById('editTimeSlot').value;
      if(!service||!date||!time_slot) return alert("All fields required");
      try{
        const res = await fetch('php/edit_appointment.php',{method:'POST',body:JSON.stringify({id:editingId,service,date,time_slot}),headers:{'Content-Type':'application/json'}});
        const data = await res.json();
        if(data.status==='success'){ showToast("Appointment updated."); editModal.style.display='none'; loadAppointments(); }
        else showToast(data.message||'Failed to update');
      }catch(e){ console.error(e); showToast('Error updating'); }
    });

    loadAppointments();
  </script>

</body>
</html>
