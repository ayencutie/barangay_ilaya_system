<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox – Barangay Ilaya Health Center</title>
<link rel="stylesheet" href="css/inbox.css">
</head>
<body>

<header class="navbar">
  <div class="logo">
    <img src="https://i.ibb.co/qFPvFtms/167565708-10159274632132790-1386372340681598199-n-removebg-preview.png" alt="Logo">
    <h1>BARANGAY ILAYA HEALTH CENTER</h1>
  </div>
  <nav>
    <ul>
      <li><a href="index.html">HOME</a></li>
      <li><a href="new about us.html">ABOUT US</a></li>
      <li><a href="new services.html">SERVICES</a></li>
      <li class="dropdown">
        <button class="dropbtn" id="menuButton">MENU ▼</button>
        <div class="dropdown-content" id="dropdownMenu">
          <a href="book appointment.html">Book Appointment</a>
          <a href="my_appointment.html">My Appointment</a>
          <a href="inbox.html" class="active">Inbox</a>
          <a href="account.html">Account</a>
        </div>
      </li>
      <li><a href="php/logout.php" class="logout-btn">LOG OUT</a></li>
    </ul>
  </nav>
</header>

<main class="content">
  <div class="inbox-container">
    <h2>Inbox</h2>

    <!-- Tab Buttons -->
    <div class="inbox-tabs">
      <button class="tab-btn active" data-tab="inbox">Inbox</button>
      <button class="tab-btn" data-tab="archive">Archive</button>
      <button class="tab-btn" data-tab="reminder">Reminder</button>
    </div>

    <!-- Messages Area -->
    <div class="messages-area">
      <div id="inbox" class="tab-content active"></div>
      <div id="archive" class="tab-content"></div>
      <div id="reminder" class="tab-content"></div>
    </div>

    <!-- Contact Admin -->
    <form id="messageForm" class="message-form">
      <textarea id="messageInput" rows="3" placeholder="Type a message to admin..." required></textarea>
      <button type="submit" class="book-btn">Send</button>
    </form>
  </div>
</main>

<script>
// --- Dropdown Menu ---
const menuButton = document.getElementById('menuButton');
const dropdownMenu = document.getElementById('dropdownMenu');
menuButton.addEventListener('click', () => dropdownMenu.classList.toggle('show'));
window.addEventListener('click', e => {
  if (!menuButton.contains(e.target) && !dropdownMenu.contains(e.target)) dropdownMenu.classList.remove('show');
});

// --- Tabs ---
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.dataset.tab;
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
  });
});

// --- Load Messages ---
function formatDate(datetime){
  const now = new Date();
  const dt = new Date(datetime);
  const diff = now - dt;
  const oneDay = 1000*60*60*24;

  if(diff < oneDay && now.getDate() === dt.getDate()) return dt.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  if(diff < 2*oneDay && now.getDate()-dt.getDate() === 1) return 'Yesterday ' + dt.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  if(diff < 7*oneDay) return dt.toLocaleDateString([], {weekday:'long'}) + ' ' + dt.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  return dt.toLocaleDateString() + ' ' + dt.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
}

function loadMessages(){
  fetch('php/get_messages.php')
  .then(res => res.json())
  .then(data => {
    ['inbox','archive','reminder'].forEach(tab => document.getElementById(tab).innerHTML = '');
    data.forEach(msg => {
      const div = document.createElement('div');
      div.className = 'message-card';
      div.innerHTML = `<strong>${msg.sender_name}</strong>: ${msg.content} <span>${formatDate(msg.created_at)}</span>`;
      document.getElementById(msg.type).appendChild(div);
    });
  });
}
loadMessages();

// --- Send Message ---
document.getElementById('messageForm').addEventListener('submit', e => {
  e.preventDefault();
  const message = document.getElementById('messageInput').value.trim();
  if(!message) return;
  fetch('php/send_message.php', {
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:`message=${encodeURIComponent(message)}&type=inbox`
  }).then(res => res.text())
    .then(()=> {
      document.getElementById('messageInput').value = '';
      loadMessages();
    });
});
</script>
</body>
</html>
