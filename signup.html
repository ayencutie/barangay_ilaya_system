<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account</title>
  <link rel="stylesheet" href="css/signup.css">
</head>
<body>
  <div class="container">
    <h2>Create an Account</h2>

    <form action="php/signup_process.php" method="POST">

      <div class="row name-row">
        <div class="field">
          <label for="last_name">Last Name</label>
          <input type="text" id="last_name" name="last_name" required>
        </div>
        <div class="field">
          <label for="first_name">First Name</label>
          <input type="text" id="first_name" name="first_name" required>
        </div>
        <div class="field small">
          <label for="middle_initial">M.I.</label>
          <input type="text" id="middle_initial" name="middle_initial" maxlength="1">
        </div>
      </div>

      <div class="field full">
        <label for="address">Address</label>
        <input type="text" id="address" name="address" required>
      </div>

      <div class="row">
        <div class="field">
          <label>Birthdate</label>
          <input type="date" id="birthdate" name="birthdate" required>
        </div>

        <div class="field">
          <label>Gender</label>
          <div class="gender-group">
            <label><input type="radio" name="gender" value="Male" required> Male</label>
            <label><input type="radio" name="gender" value="Female" required> Female</label>
            <label><input type="radio" name="gender" value="Custom" required id="customRadio"> Custom</label>
          </div>
          <input type="text" id="customGender" name="customGender" placeholder="Enter gender" style="display:none;">
        </div>

        <div class="field">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" pattern="[0-9]{11}" title="Enter 11-digit number" required>
        </div>
      </div>

      <div class="field full">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="row password-row">
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        <div class="field">
          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" required>
        </div>
      </div>

      <button type="submit">Create Account</button>

      <p>Already have an account? <a href="login.php">Log In</a></p>
    </form>
  </div>

  <script>
    const customRadio = document.getElementById("customRadio");
    const customInput = document.getElementById("customGender");
    const genderRadios = document.querySelectorAll('input[name="gender"]');

    genderRadios.forEach(r => {
      r.addEventListener("change", () => {
        customInput.style.display = customRadio.checked ? "block" : "none";
      });
    });
  </script>
</body>
</html>
