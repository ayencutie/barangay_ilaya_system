<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account</title>
  <link rel="stylesheet" href="css/signup.css">
</head>
<body>
  <div class="container">
    <h2>Create an Account</h2>

    <form action="php/signup_process.php" method="POST" id="signupForm">

      <!-- Name Fields -->
      <div class="row name-row">
        <div class="field">
          <label for="last_name">Last Name</label>
          <input type="text" id="last_name" name="last_name" required>
        </div>
        <div class="field">
          <label for="first_name">First Name</label>
          <input type="text" id="first_name" name="first_name" required>
        </div>
        <div class="field small">
          <label for="middle_initial">M.I.</label>
          <input type="text" id="middle_initial" name="middle_initial" maxlength="1">
        </div>
      </div>

      <!-- Address -->
      <div class="field full">
        <label for="address">Address</label>
        <input type="text" id="address" name="address" required>
      </div>

      <!-- Birthdate & Gender row -->
      <div class="row">
        <!-- Birthdate -->
        <div class="field">
          <label>Birthdate</label>
          <div class="birthdate-picker">
            <select id="birth_month" name="birth_month" required>
              <option value="">Month</option>
              <option value="01">January</option>
              <option value="02">February</option>
              <option value="03">March</option>
              <option value="04">April</option>
              <option value="05">May</option>
              <option value="06">June</option>
              <option value="07">July</option>
              <option value="08">August</option>
              <option value="09">September</option>
              <option value="10">October</option>
              <option value="11">November</option>
              <option value="12">December</option>
            </select>

            <select id="birth_day" name="birth_day" required>
              <option value="">Day</option>
            </select>

            <select id="birth_year" name="birth_year" required>
              <option value="">Year</option>
            </select>
          </div>
        </div>

        <!-- Gender -->
        <div class="field">
          <label>Gender</label>
          <div class="gender-group">
            <label><input type="radio" name="gender" value="Male" required> Male</label>
            <label><input type="radio" name="gender" value="Female" required> Female</label>
            <label><input type="radio" name="gender" value="Custom" id="customRadio" required> Custom</label>
          </div>
          <input type="text" id="customGender" name="customGender" placeholder="Enter gender" style="display:none;">
        </div>
      </div>

      <!-- Phone & Email row -->
      <div class="row">
        <div class="field">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone"
                 pattern="^09\d{9}$"
                 title="Phone number must start with 09 and be 11 digits only"
                 required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
      </div>

      <!-- Password -->
      <div class="row password-row">
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        <div class="field">
          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" required>
        </div>
      </div>

      <button type="submit">Create Account</button>
      <p>Already have an account? <a href="login.php">Log In</a></p>
    </form>
  </div>

  <script>
    // Show custom gender input
    const customRadio = document.getElementById("customRadio");
    const customInput = document.getElementById("customGender");
    document.querySelectorAll('input[name="gender"]').forEach(radio => {
      radio.addEventListener("change", () => {
        customInput.style.display = customRadio.checked ? "block" : "none";
      });
    });

    // Populate days 1-31
    const daySelect = document.getElementById("birth_day");
    for (let d = 1; d <= 31; d++) {
      const opt = document.createElement("option");
      opt.value = d.toString().padStart(2, "0");
      opt.textContent = d;
      daySelect.appendChild(opt);
    }

    // Populate years dynamically (1950 - current)
    const yearSelect = document.getElementById("birth_year");
    const currentYear = new Date().getFullYear();
    for (let y = currentYear; y >= 1950; y--) {
      const opt = document.createElement("option");
      opt.value = y;
      opt.textContent = y;
      yearSelect.appendChild(opt);
    }

    // Combine birthdate before submit
    document.getElementById("signupForm").addEventListener("submit", function(e) {
      const month = document.getElementById("birth_month").value;
      const day = document.getElementById("birth_day").value;
      const year = document.getElementById("birth_year").value;

      if (!month || !day || !year) {
        e.preventDefault();
        alert("Please select a complete birthdate.");
        return;
      }

      // Hidden input for combined birthdate
      let hidden = document.getElementById("birthdate_hidden");
      if (!hidden) {
        hidden = document.createElement("input");
        hidden.type = "hidden";
        hidden.name = "birthdate";
        hidden.id = "birthdate_hidden";
        this.appendChild(hidden);
      }
      hidden.value = `${year}-${month}-${day}`;

      // Validate phone
      const phone = document.getElementById("phone").value.trim();
      if (!/^09\d{9}$/.test(phone)) {
        e.preventDefault();
        alert("Phone must start with 09 and be 11 digits.");
      }

      // Validate passwords match
      const pass = document.getElementById("password").value;
      const confirm = document.getElementById("confirm_password").value;
      if (pass !== confirm) {
        e.preventDefault();
        alert("Passwords do not match!");
      }
    });
  </script>
</body>
</html>
