<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Settings – Barangay Ilaya Health Center</title>
  <link rel="stylesheet" href="css/account.css" />
</head>
<body>

  <header class="navbar">
    <div class="logo"><img src="https://i.ibb.co/qFPvFtms/167565708-10159274632132790-1386372340681598199-n-removebg-preview.png" alt="Logo"><h1>BARANGAY ILAYA HEALTH CENTER</h1></div>
    <nav>
      <ul>
        <li><a href="index.html">HOME</a></li>
        <li><a href="new about us.html">ABOUT US</a></li>
        <li><a href="new services.html">SERVICES</a></li>
        <li class="dropdown">
          <button class="dropbtn" id="menuButton">MENU ▼</button>
          <div class="dropdown-content" id="dropdownMenu">
            <a href="book appointment.html">Book Appointment</a>
            <a href="my_appointment.html">My Appointment</a>
            <a href="inbox.html">Inbox</a>
            <a href="account.html">Account</a>
          </div>
        </li>
        <li><a href="login.html" class="logout-btn">LOG OUT</a></li>
      </ul>
    </nav>
  </header>

  <main class="content">
    <div class="account-card form-card">
      <h2>Account Settings</h2>

      <div class="profile-grid">
        <div class="profile-item"><label>Account ID</label><div id="acct">0001</div></div>
        <div class="profile-item"><label>Full Name</label><div id="name">Juan Dela Cruz</div></div>
        <div class="profile-item"><label>Email</label><div id="email">juan@example.com</div></div>
        <div class="profile-item"><label>Phone</label><div id="phone">09171234567 <button id="chgPhone" class="btn small">Change</button></div></div>
      </div>

      <hr>
      <h3>Change Password</h3>
      <form id="pwdForm">
        <input type="password" id="oldpwd" placeholder="Old password" required>
        <input type="password" id="newpwd" placeholder="New password" required>
        <input type="password" id="confirmpwd" placeholder="Confirm new password" required>
        <button type="submit" class="btn">Change Password</button>
      </form>
    </div>
  </main>

  <div id="phoneModal" class="modal">
    <div class="modal-content">
      <h4>Change Phone Number</h4>
      <input id="newPhone" placeholder="11-digit phone" maxlength="11">
      <input id="pwdForPhone" type="password" placeholder="Enter your password">
      <div class="modal-actions">
        <button id="savePhone" class="btn">Save</button>
        <button id="closePhone" class="btn alt">Cancel</button>
      </div>
    </div>
  </div>

<script>
document.getElementById('chgPhone').addEventListener('click', ()=>document.getElementById('phoneModal').style.display='flex');
document.getElementById('closePhone').addEventListener('click', ()=>document.getElementById('phoneModal').style.display='none');
document.getElementById('savePhone').addEventListener('click', ()=>{ const phone=document.getElementById('newPhone').value; const pwd=document.getElementById('pwdForPhone').value; if(!/^\d{11}$/.test(phone)){alert('Enter 11-digit'); return;} alert('Phone updated (simulated).'); document.getElementById('phone').firstChild.nodeValue=phone+' '; document.getElementById('phoneModal').style.display='none';});
document.getElementById('pwdForm').addEventListener('submit',(e)=>{ e.preventDefault(); if(document.getElementById('newpwd').value !== document.getElementById('confirmpwd').value){ alert('Passwords do not match'); return;} alert('Password changed (simulated).'); e.target.reset(); });
</script>
</body>
</html>
