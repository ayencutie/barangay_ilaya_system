<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Settings – Barangay Ilaya Health Center</title>
<link rel="stylesheet" href="css/account.css">
</head>
<body>

<header class="navbar">
  <div class="logo">
    <img src="https://i.ibb.co/qFPvFtms/167565708-10159274632132790-1386372340681598199-n-removebg-preview.png" alt="Logo">
    <h1>BARANGAY ILAYA HEALTH CENTER</h1>
  </div>
  <nav>
    <ul>
      <li><a href="index.html">HOME</a></li>
      <li><a href="new about us.html">ABOUT US</a></li>
      <li><a href="new services.html">SERVICES</a></li>
      <li class="dropdown">
        <button class="dropbtn" id="menuButton">MENU ▼</button>
        <div class="dropdown-content" id="dropdownMenu">
          <a href="book appointment.html">Book Appointment</a>
          <a href="my_appointment.html">My Appointment</a>
          <a href="inbox.php">Inbox</a>
          
          <a href="account.html" class="active">Account</a>
          <a href="php/logout.php" class="logout-btn">Log Out</a>
        </div>
      </li>
    </ul>
  </nav>
</header>

<main class="content">
  <div class="account-card form-card">
    <h2>Account Settings</h2>
    <div id="messages"></div>

    <div class="profile-list">
      <div class="profile-item"><label>Patient ID</label><div id="patientId"></div></div>
      <div class="profile-item"><label>Full Name</label><div id="name"></div></div>
      <div class="profile-item"><label>Address</label><div id="address"></div></div>
      <div class="profile-item"><label>Birthdate</label><div id="birthdate"></div></div>
      <div class="profile-item"><label>Email</label><div id="email"></div></div>
      <div class="profile-item"><label>Phone</label><div id="phone"></div></div>
    </div>

    <div class="action-buttons">
      <button id="chgPhone" class="btn">Change Phone</button>
      <button id="chgPassword" class="btn">Change Password</button>
    </div>

    <!-- PHONE FORM -->
    <form id="phoneForm" class="password-form" style="display:none;">
      <h3>Change Phone Number</h3>
      <input type="text" id="newPhone" placeholder="Enter new phone number" maxlength="11" required>
      <input type="password" id="pwdForPhone" placeholder="Enter your password" required>
      <button type="submit" class="btn">Save Phone</button>
    </form>

    <!-- PASSWORD FORM -->
    <form id="pwdForm" class="password-form" style="display:none;">
      <h3>Change Password</h3>
      <input type="password" id="oldpwd" placeholder="Old password" required>
      <input type="password" id="newpwd" placeholder="New password" required>
      <input type="password" id="confirmpwd" placeholder="Confirm new password" required>
      <button type="submit" class="btn">Save Password</button>
    </form>
  </div>
</main>

<script>
// --- Dropdown Menu ---
const menuButton = document.getElementById('menuButton');
const dropdownMenu = document.getElementById('dropdownMenu');
menuButton.addEventListener('click', ()=>dropdownMenu.classList.toggle('show'));
window.addEventListener('click', e => {
  if(!menuButton.contains(e.target) && !dropdownMenu.contains(e.target))
    dropdownMenu.classList.remove('show');
});

// --- Capitalize Function ---
function capitalizeWords(str) {
  return str.replace(/\b\w/g, char => char.toUpperCase());
}

// --- Fetch user data ---
function loadUser(){
  fetch('php/get_user.php')
  .then(res=>res.json())
  .then(data=>{
    if(data.error){
      alert(data.error);
      window.location.href='login.php';
      return;
    }
    document.getElementById('patientId').textContent = data.patient_id;
    document.getElementById('name').textContent = capitalizeWords(data.first_name + ' ' + data.last_name);
    document.getElementById('address').textContent = capitalizeWords(data.address);
    document.getElementById('birthdate').textContent = new Date(data.birthdate).toLocaleDateString('en-PH', {
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });
    document.getElementById('email').textContent = data.email;
    document.getElementById('phone').textContent = data.phone;
  });
}
loadUser();

// --- Show/Hide Forms ---
const pwdForm = document.getElementById('pwdForm');
const phoneForm = document.getElementById('phoneForm');

document.getElementById('chgPassword').addEventListener('click', ()=> {
  pwdForm.style.display = pwdForm.style.display === 'none' ? 'flex' : 'none';
  phoneForm.style.display = 'none';
  pwdForm.scrollIntoView({behavior:'smooth'});
});

document.getElementById('chgPhone').addEventListener('click', ()=> {
  phoneForm.style.display = phoneForm.style.display === 'none' ? 'flex' : 'none';
  pwdForm.style.display = 'none';
  phoneForm.scrollIntoView({behavior:'smooth'});
});

// --- Update Phone ---
phoneForm.addEventListener('submit', e=>{
  e.preventDefault();
  const phone = document.getElementById('newPhone').value;
  const pwd = document.getElementById('pwdForPhone').value;
  const msgDiv = document.getElementById('messages');

  if(!/^\d{11}$/.test(phone)){
    alert('Please enter a valid 11-digit phone number.');
    return;
  }

  fetch('php/update_phone.php', {
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:`phone=${encodeURIComponent(phone)}&password=${encodeURIComponent(pwd)}`
  })
  .then(res=>res.text())
  .then(data=>{
    msgDiv.innerHTML = data;
    if(data.includes('success')){
      document.getElementById('phone').textContent = phone;
      phoneForm.reset();
      phoneForm.style.display = 'none';
    }
  });
});

// --- Update Password ---
pwdForm.addEventListener('submit', e=>{
  e.preventDefault();
  const oldpwd = document.getElementById('oldpwd').value;
  const newpwd = document.getElementById('newpwd').value;
  const confirmpwd = document.getElementById('confirmpwd').value;
  const msgDiv = document.getElementById('messages');

  if(newpwd !== confirmpwd){
    alert('Passwords do not match');
    return;
  }

  fetch('php/update_password.php', {
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:`old_password=${encodeURIComponent(oldpwd)}&new_password=${encodeURIComponent(newpwd)}&confirm_password=${encodeURIComponent(confirmpwd)}`
  })
  .then(res=>res.text())
  .then(data=>{
    msgDiv.innerHTML = data;
    if(data.includes('success')){
      pwdForm.reset();
      pwdForm.style.display = 'none';
    }
  });
});
</script>
</body>
</html>
