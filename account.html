<main class="content">
  <div class="account-card form-card">
    <h2>Account Settings</h2>
    <div id="messages"></div>

    <!-- PROFILE PICTURE SECTION -->
    <div class="profile-picture-container">
      <img id="profileImage" class="profile-picture" src="uploads/default_profile.png" alt="Profile Picture">
      <div class="profile-picture-actions">
        <button class="btn" onclick="document.getElementById('profileInput').click()">Change</button>
        <button class="btn alt" id="removePic">Remove</button>
      </div>
      <form id="uploadProfileForm" enctype="multipart/form-data" style="display:none;">
        <input type="file" id="profileInput" name="profile" accept="image/*">
      </form>
    </div>

    <div class="profile-grid">
      <div class="grid-row">
        <div class="grid-col name-col">
          <label class="field-label">Full Name <span id="patientId" class="patient-id-small"></span></label>
          <div id="name" class="profile-value"></div>
        </div>
        <div class="grid-col address-col">
          <label class="field-label">Address</label>
          <div id="address" class="profile-value"></div>
        </div>
      </div>

      <div class="info-row">
        <div class="info-col">
          <label class="field-label">Email</label>
          <div id="email" class="profile-value"></div>
        </div>
        <div class="info-col">
          <label class="field-label">Birthdate</label>
          <div id="birthdate" class="profile-value"></div>
        </div>
        <div class="info-col">
          <label class="field-label">Phone</label>
          <div id="phone" class="profile-value"></div>
        </div>
      </div>
    </div>

    <div class="action-buttons">
      <button id="chgPhone" class="btn">Change Phone</button>
      <button id="chgPassword" class="btn">Change Password</button>
    </div>

    <!-- Floating panels for change phone and change password (hidden by default) -->
    <!-- Backdrop -->
    <div id="panelBackdrop" class="panel-backdrop" style="display:none;"></div>

    <!-- Phone Panel -->
    <div id="phonePanel" class="floating-panel" style="display:none;" aria-hidden="true">
      <button class="close-panel" id="closePhone" aria-label="Close">×</button>
      <h3>Change Phone Number</h3>
      <form id="phoneForm" class="password-form">
        <input type="text" id="newPhone" placeholder="Enter new phone number" maxlength="11" required>
        <input type="password" id="pwdForPhone" placeholder="Enter your password" required>
        <div style="display:flex;justify-content:flex-end;margin-top:8px;"><button type="submit" class="btn">Save Phone</button></div>
      </form>
    </div>

    <!-- Password Panel -->
    <div id="pwdPanel" class="floating-panel" style="display:none;" aria-hidden="true">
      <button class="close-panel" id="closePwd" aria-label="Close">×</button>
      <h3>Change Password</h3>
      <form id="pwdForm" class="password-form">
        <input type="password" id="oldpwd" placeholder="Old password" required>
        <input type="password" id="newpwd" placeholder="New password" required>
        <input type="password" id="confirmpwd" placeholder="Confirm new password" required>
        <div style="display:flex;justify-content:flex-end;margin-top:8px;"><button type="submit" class="btn">Save Password</button></div>
      </form>
    </div>
  </div>
</main>

<script>
// --- Dropdown Menu ---
const menuButton = document.getElementById('menuButton');
const dropdownMenu = document.getElementById('dropdownMenu');
if (menuButton && dropdownMenu) {
  menuButton.addEventListener('click', ()=>dropdownMenu.classList.toggle('show'));
  window.addEventListener('click', e => {
    if(!menuButton.contains(e.target) && !dropdownMenu.contains(e.target))
      dropdownMenu.classList.remove('show');
  });
}

// --- Capitalize Function ---
function capitalizeWords(str) {
  return str.replace(/\b\w/g, char => char.toUpperCase());
}

// --- Fetch user data ---
function loadUser(){
  fetch('php/get_user.php')
  .then(res=>res.json())
  .then(data=>{
    if(data.error){
      alert(data.error);
      window.location.href='login.php';
      return;
    }
    document.getElementById('patientId').textContent = data.patient_id;
    document.getElementById('name').textContent = capitalizeWords(data.first_name + ' ' + data.last_name);
    document.getElementById('address').textContent = capitalizeWords(data.address);
    document.getElementById('birthdate').textContent = new Date(data.birthdate).toLocaleDateString('en-PH', {
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });
    document.getElementById('email').textContent = data.email;
    document.getElementById('phone').textContent = data.phone;
    
      // PROFILE PICTURE: use stored path if present, otherwise gender-based default
      const picEl = document.getElementById('profileImage');
      const pic = data.profile_pic && data.profile_pic.trim() !== '' ? data.profile_pic : null;
      if (pic) {
        picEl.src = pic.indexOf('?') === -1 ? pic + '?v=' + Date.now() : pic;
      } else if (data.gender && data.gender.toLowerCase().startsWith('m')) {
        picEl.src = 'uploads/default_male.svg';
      } else if (data.gender && data.gender.toLowerCase().startsWith('f')) {
        picEl.src = 'uploads/default_female.svg';
      } else {
        picEl.src = 'uploads/default_profile.png';
      }
      // populate nav profile (if navbar present)
      const navImg = document.getElementById('navProfileImage');
      const navName = document.getElementById('navProfileName');
      const navPid = document.getElementById('navPatientId');
      if (navImg) navImg.src = picEl.src;
      if (navName) navName.textContent = capitalizeWords(data.first_name + ' ' + data.last_name);
      if (navPid) navPid.textContent = data.patient_id;
  });
}
loadUser();

// === Profile upload/remove handlers ===
const profileInput = document.getElementById('profileInput');
if (profileInput) {
  profileInput.addEventListener('change', () => {
    const file = profileInput.files[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('profile', file);

    fetch('php/upload_profile.php', { method: 'POST', body: fd })
      .then(r => r.json())
      .then(j => {
        const msgDiv = document.getElementById('messages');
        if (j.status === 'success') {
          msgDiv.innerHTML = '<div class="success-message">Profile picture updated.</div>';
        } else {
          msgDiv.innerHTML = '<div class="error-message">' + (j.message || 'Upload failed') + '</div>';
        }
        loadUser();
      })
      .catch(err => {
        document.getElementById('messages').innerHTML = '<div class="error-message">Upload failed (network)</div>';
        console.error(err);
      });
  });
}

const removeBtn = document.getElementById('removePic');
if (removeBtn) {
  removeBtn.addEventListener('click', ()=>{
    if (!confirm('Remove profile picture?')) return;
    fetch('php/remove_profile.php', { method: 'POST' })
      .then(r => r.json())
      .then(j => {
        const msgDiv = document.getElementById('messages');
        if (j.status === 'success') msgDiv.innerHTML = '<div class="success-message">Profile removed.</div>';
        else msgDiv.innerHTML = '<div class="error-message">' + (j.message || 'Remove failed') + '</div>';
        loadUser();
      })
      .catch(err => {
        document.getElementById('messages').innerHTML = '<div class="error-message">Request failed</div>';
      });
  });
}

// --- Floating panels behavior ---
const pwdForm = document.getElementById('pwdForm');
const phoneForm = document.getElementById('phoneForm');
const panelBackdrop = document.getElementById('panelBackdrop');
const phonePanel = document.getElementById('phonePanel');
const pwdPanel = document.getElementById('pwdPanel');
const closePhone = document.getElementById('closePhone');
const closePwd = document.getElementById('closePwd');

function openPanel(panel){
  panelBackdrop.style.display = 'block';
  panel.style.display = 'block';
  panel.setAttribute('aria-hidden','false');
  const first = panel.querySelector('input');
  if (first) first.focus();
}
function closePanels(){
  panelBackdrop.style.display = 'none';
  phonePanel.style.display = 'none';
  pwdPanel.style.display = 'none';
  phonePanel.setAttribute('aria-hidden','true');
  pwdPanel.setAttribute('aria-hidden','true');
}

document.getElementById('chgPassword').addEventListener('click', ()=> openPanel(pwdPanel));
document.getElementById('chgPhone').addEventListener('click', ()=> openPanel(phonePanel));

closePhone && closePhone.addEventListener('click', closePanels);
closePwd && closePwd.addEventListener('click', closePanels);
panelBackdrop && panelBackdrop.addEventListener('click', closePanels);

// --- Update Phone ---
phoneForm.addEventListener('submit', e=>{
  e.preventDefault();
  const phone = document.getElementById('newPhone').value;
  const pwd = document.getElementById('pwdForPhone').value;
  const msgDiv = document.getElementById('messages');

  if(!/^\d{11}$/.test(phone)){
    alert('Please enter a valid 11-digit phone number.');
    return;
  }

  fetch('php/update_phone.php', {
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:`phone=${encodeURIComponent(phone)}&password=${encodeURIComponent(pwd)}`
  })
  .then(res=>res.text())
  .then(data=>{
    msgDiv.innerHTML = data;
    if(data.includes('success')){
      document.getElementById('phone').textContent = phone;
      phoneForm.reset();
      closePanels();
    }
  });
});

// --- Update Password ---
// --- Update Password ---
pwdForm.addEventListener('submit', e=>{
  e.preventDefault();
  const oldpwd = document.getElementById('oldpwd').value;
  const newpwd = document.getElementById('newpwd').value;
  const confirmpwd = document.getElementById('confirmpwd').value;
  const msgDiv = document.getElementById('messages');

  if(newpwd !== confirmpwd){
    alert('Passwords do not match');
    return;
  }

  fetch('php/update_password.php', {
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:`old_password=${encodeURIComponent(oldpwd)}&new_password=${encodeURIComponent(newpwd)}&confirm_password=${encodeURIComponent(confirmpwd)}`
  })
  .then(res=>res.text())
  .then(data=>{
    msgDiv.innerHTML = data;
    if(data.includes('success')){
      pwdForm.reset();
      closePanels();
    }
  });
});
</script>
</body>
</html>
