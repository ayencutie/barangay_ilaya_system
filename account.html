<script>
// ================= 1. NAVBAR LOGIC =================
const menuBtn = document.getElementById('menuButton');
const menuDropdown = document.getElementById('menuDropdown');
const profileBtn = document.getElementById('profileButton');
const profileDropdown = document.getElementById('profileDropdown');

function closeAll() {
  if(menuDropdown) menuDropdown.classList.remove('show');
  if(profileDropdown) profileDropdown.hidden = true;
}

if(menuBtn) menuBtn.addEventListener('click', (e) => { e.stopPropagation(); menuDropdown.classList.toggle('show'); });
if(profileBtn) profileBtn.addEventListener('click', (e) => { e.stopPropagation(); profileDropdown.hidden = !profileDropdown.hidden; });
window.addEventListener('click', closeAll);

// ================= 2. HELPER: SHOW MESSAGE =================
function showMessage(msg, type) {
  const msgDiv = document.getElementById('messages');
  msgDiv.innerHTML = `<div class="${type}-message">${msg}</div>`;
  setTimeout(() => msgDiv.innerHTML = '', 5000);
}

// ================= 3. FETCH USER INFO =================
function capitalizeWords(str) {
  return str ? str.replace(/\b\w/g, char => char.toUpperCase()) : '';
}

function loadUser(){
  fetch('php/get_user.php')
  .then(res=>res.json())
  .then(data=>{
    if(data.error) return;
    
    const picUrl = data.profile_pic && data.profile_pic.trim() !== '' ? (data.profile_pic.indexOf('?') === -1 ? data.profile_pic + '?v=' + Date.now() : data.profile_pic) : 'uploads/default_profile.png';

    // Navbar
    if(document.getElementById('userAvatar')) document.getElementById('userAvatar').src = picUrl;
    if(document.getElementById('dropdownAvatar')) document.getElementById('dropdownAvatar').src = picUrl;
    if(document.getElementById('userName')) document.getElementById('userName').innerText = capitalizeWords(data.first_name + ' ' + data.last_name);
    if(document.getElementById('userId')) document.getElementById('userId').innerText = data.patient_id;

    // Page
    document.getElementById('profileImage').src = picUrl;
    document.getElementById('patientId').textContent = data.patient_id;
    document.getElementById('name').textContent = capitalizeWords(data.first_name + ' ' + data.last_name);
    document.getElementById('address').textContent = capitalizeWords(data.address);
    document.getElementById('birthdate').textContent = new Date(data.birthdate).toLocaleDateString('en-PH', { year: 'numeric', month: 'long', day: 'numeric' });
    document.getElementById('email').textContent = data.email;
    document.getElementById('phone').textContent = data.phone;

  }).catch(err => console.log(err));
}
loadUser(); // Load data immediately

// ================= 4. FUNCTIONALITIES =================

// A. CHANGE PROFILE PICTURE
const profileInput = document.getElementById('profileInput');
if (profileInput) {
  profileInput.addEventListener('change', () => {
    const file = profileInput.files[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('profile', file);

    fetch('php/upload_profile.php', { method: 'POST', body: fd })
      .then(r => r.json())
      .then(j => {
        if (j.status === 'success') {
          showMessage('Profile picture updated!', 'success');
          loadUser(); 
        } else {
          showMessage(j.message || 'Upload failed', 'error');
        }
      })
      .catch(err => showMessage('Upload failed (network error)', 'error'));
  });
}

// B. REMOVE PROFILE PICTURE
const removeBtn = document.getElementById('removePic');
if (removeBtn) {
  removeBtn.addEventListener('click', ()=>{
    if (!confirm('Remove profile picture?')) return;
    
    fetch('php/remove_profile.php', { method: 'POST' })
      .then(r => r.json())
      .then(j => {
        if (j.status === 'success') {
            showMessage('Profile picture removed.', 'success');
            loadUser(); 
        } else {
            showMessage(j.message || 'Remove failed', 'error');
        }
      })
      .catch(err => showMessage('Request failed', 'error'));
  });
}

// C. CHANGE PHONE NUMBER
const phoneForm = document.getElementById('phoneForm');
phoneForm.addEventListener('submit', e=>{
  e.preventDefault();
  const formData = new FormData(phoneForm);

  fetch('php/update_phone.php', {
    method: 'POST',
    body: formData 
  })
  .then(res => res.text()) // Use text() first to debug if PHP returns HTML error
  .then(text => {
      try {
          // Try to parse as JSON if possible
          const data = JSON.parse(text); 
          if(data.status === 'success' || text.includes('success-message')){
             showMessage('Phone updated successfully!', 'success');
             closePanels();
             loadUser();
             phoneForm.reset();
          } else {
             // If PHP returns HTML string (based on your uploaded file snippet)
             document.getElementById('messages').innerHTML = text; 
             closePanels();
          }
      } catch(e) {
          // Fallback if PHP returns raw HTML div
          document.getElementById('messages').innerHTML = text;
          if(text.includes('success')) { closePanels(); loadUser(); phoneForm.reset(); }
      }
  });
});

// D. CHANGE PASSWORD
const pwdForm = document.getElementById('pwdForm');
pwdForm.addEventListener('submit', e=>{
  e.preventDefault();
  const formData = new FormData(pwdForm);

  // Basic Validation
  const newP = formData.get('new_password');
  const confP = formData.get('confirm_password');
  if(newP !== confP){ alert('Passwords do not match'); return; }

  fetch('php/update_password.php', {
    method: 'POST',
    body: formData
  })
  .then(res => res.text())
  .then(text => {
      // Your PHP file returns HTML <div> strings, not JSON. So we insert it directly.
      document.getElementById('messages').innerHTML = text;
      if(text.includes('success')){
          closePanels();
          pwdForm.reset();
      }
  });
});

// ================= 5. MODAL/PANEL LOGIC =================
const panelBackdrop = document.getElementById('panelBackdrop');
const phonePanel = document.getElementById('phonePanel');
const pwdPanel = document.getElementById('pwdPanel');
const closePhone = document.getElementById('closePhone');
const closePwd = document.getElementById('closePwd');

function openPanel(panel){
  panelBackdrop.style.display = 'block';
  panel.style.display = 'block';
  const first = panel.querySelector('input');
  if (first) first.focus();
}
function closePanels(){
  panelBackdrop.style.display = 'none';
  phonePanel.style.display = 'none';
  pwdPanel.style.display = 'none';
}

document.getElementById('chgPassword').addEventListener('click', ()=> openPanel(pwdPanel));
document.getElementById('chgPhone').addEventListener('click', ()=> openPanel(phonePanel));
closePhone && closePhone.addEventListener('click', closePanels);
closePwd && closePwd.addEventListener('click', closePanels);
panelBackdrop && panelBackdrop.addEventListener('click', closePanels);

// ================= 6. NOTIFICATION SIMULATION =================
function triggerNotification(message) {
  const badge = document.getElementById('msgBadge');
  const toastBox = document.getElementById('toastBox');
  const audio = document.getElementById('notifSound');

  if(badge) { badge.style.display = 'flex'; badge.innerText = '1'; }
  if(audio) audio.play().catch(() => {}); 

  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `<div class="toast-icon">📩</div><div class="toast-msg"><h4>New Message</h4><p>${message}</p></div>`;
  toastBox.appendChild(toast);

  setTimeout(() => toast.classList.add('show'), 100);
  setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 500); }, 5000);
}

setTimeout(() => { triggerNotification("You have a new message from Admin."); }, 3000);

</script>
